[project]
name = "lab-1"
version = "0.1.0"
description = "MLOps Lab 1: PyTorch Lightning, Model Monitoring & Hyperparameter Optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel",
    "jupyter",
    "lightning>=2.2.0",
    "matplotlib>=3.8.0",
    "medmnist>=3.0.0",
    "numpy",
    "optuna>=3.6.0",
    "pandas",
    "scikit-learn>=1.4.0",
    "scipy",
    "torchmetrics>=1.3.0",
    "wandb>=0.17.0",
]

[project.optional-dependencies]
cpu = [
    "torch",
    "torchvision",
]
cu126 = [
    "torch",
    "torchvision",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
